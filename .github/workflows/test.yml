name: 🧪 Test Bun

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # สั่งเปิด Redis Container ขึ้นมาใช้งานในระบบจำลองซะเลย 🚀
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        env:
          # ถ้ามี Secret ของเราก็ใช้ (สำหรับ Repo หลัก) ถ้าไม่มีให้ชี้ไปที่ Local Redis ของเครื่อง CI เองเลย!
          REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6379' }}
        run: bun test