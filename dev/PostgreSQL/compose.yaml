services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      # These credentials are for the initial database setup
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydatabase
    ports:
      # Map the container's port 5432 to the host's port 5432
      - "5432:5432"
    volumes:
      # Persist data even after the container stops
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      # These credentials are for logging into the pgAdmin web interface
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: mysecretpassword
    ports:
      # Map the container's port 80 to the host's port 8080 (or another available port)
      - "8080:80"
    volumes:
      # Persist pgAdmin configuration
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
